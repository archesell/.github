name: 💡 Story
description: 提出一个新功能或改进建议
title: "[Story]: "
labels: ["story", "feature"]
assignees: []
body:

  - type: markdown
    attributes:
      value: |
        欢迎提出功能建议！请描述清楚需求和使用场景。

  - type: textarea
    id: description
    attributes:
      label: 🎯 功能描述
      placeholder: 希望增加XX功能 / 优化XX交互...
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 🧑‍💻 使用场景
      description: 谁在什么场景下会用到
      placeholder: 用户在做XX时，需要...

  - type: textarea
    id: solution
    attributes:
      label: 🛠️ 建议方案
      placeholder: 你希望如何实现 / 参考XX产品的设计

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 替代方案
      placeholder: 目前有什么替代方式